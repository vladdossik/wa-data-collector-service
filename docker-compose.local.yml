version: '3.8'

services:
  data-collector-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-collector-service-local
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-wa-kafka:9092}
      REDIS_HOST: ${REDIS_HOST:-wa-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-5s}
    networks:
      - wa-local-network

networks:
  data-collector-local-network:
    driver: bridge
  wa-local-network:
    name: wa-local-network
    driver: bridge
    external: true